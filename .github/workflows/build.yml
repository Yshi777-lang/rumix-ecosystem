name: Build APK
on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Accept Android SDK licenses
        run: yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

      - name: Build with Gradle
        run: |
          cd apk
          chmod +x gradlew
          ./gradlew clean assembleDebug

      - name: Prepare APK for upload
        run: |
          echo "=== Ищем собранный APK ==="
          find apk/app/build/outputs/apk/ -name "*.apk" -type f
          cp apk/app/build/outputs/apk/debug/app-debug.apk ./rumix-debug.apk
          echo "✅ APK найден и скопирован в корень:"
          ls -lh ./rumix-debug.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: rumix-apk
          path: rumix-debug.apk
          retention-days: 7

      - name: Create Release
        if: success()
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Rumix build ${{ github.run_number }}
          files: rumix-debug.apk
          draft: false
          prerelease: true
