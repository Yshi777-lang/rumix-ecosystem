name: Build Rumix APK
on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/gradle-build-action@v2

      - name: Build APK
        run: |
          cd apk
          chmod +x gradlew || echo "gradlew not found, using system gradle"
          # Если gradlew нет, GitHub Action сам его сгенерирует или используем системный
          gradle wrapper || true
          ./gradlew assembleDebug

      - name: Prepare Artifact
        run: |
          echo "=== Ищем APK ==="
          find apk/app/build/outputs/apk/ -name "*.apk" -type f
          cp apk/app/build/outputs/apk/debug/app-debug.apk ./rumix-reborn-debug.apk
          ls -lh ./rumix-reborn-debug.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: rumix-reborn-apk
          path: rumix-reborn-debug.apk
          retention-days: 7

      - name: Create Release
        if: success()
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Rumix Reborn Build ${{ github.run_number }}
          files: rumix-reborn-debug.apk
          draft: false
          prerelease: true
