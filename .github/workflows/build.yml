name: Build APK
on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Accept Android SDK licenses
        run: yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

      - name: Setup Gradle 8.2
        run: |
          wget https://services.gradle.org/distributions/gradle-8.2-bin.zip
          unzip -q gradle-8.2-bin.zip
          echo "$PWD/gradle-8.2/bin" >> $GITHUB_PATH

      - name: Build with Gradle 8.2
        run: |
          cd apk
          gradle assembleDebug

      - name: Find and Upload APK
        run: |
          echo "=== Searching for APK ==="
          find . -name "*.apk" -type f
          find . -name "*.apk" -type f -exec cp {} ./app-debug.apk \;
          if [ -f ./app-debug.apk ]; then
            echo "✅ APK found and copied to root!"
            ls -lh ./app-debug.apk
          else
            echo "❌ APK NOT FOUND!"
            exit 1
          fi

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: rumix-apk
          path: app-debug.apk
          retention-days: 7

      - name: Create Release
        if: success()
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Rumix build ${{ github.run_number }}
          files: app-debug.apk
          draft: false
          prerelease: true
