name: Build APK
on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Accept Android SDK licenses
        working-directory: apk
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses || true

      - name: Make gradlew executable
        working-directory: apk
        run: chmod +x ./gradlew

      - name: Build APK
        working-directory: apk
        shell: bash
        run: |
          set -o pipefail
          ./gradlew --no-daemon clean assembleDebug 2>&1 | tee gradle.log

      - name: Verify APK
        shell: bash
        run: |
          APK="apk/app/build/outputs/apk/debug/app-debug.apk"
          if [ ! -s "$APK" ]; then
            echo "::error::APK missing or empty: $APK"
            exit 1
          fi
          ls -lh "$APK"

      - name: Show Gradle log
        if: always()
        run: |
          if [ -f apk/gradle.log ]; then
            tail -80 apk/gradle.log
          fi

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: rumix-debug-apk
          path: |
            apk/app/build/outputs/apk/debug/app-debug.apk
            apk/gradle.log
          if-no-files-found: error

      - name: Create Release
        if: success()
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Rumix build ${{ github.run_number }}
          files: apk/app/build/outputs/apk/debug/app-debug.apk
          draft: false
          prerelease: true
